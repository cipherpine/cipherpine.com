<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <!-- Background -->
  <defs>
    <radialGradient id="glow1" cx="50%" cy="0%" r="60%">
      <stop offset="0%" stop-color="#2d7a4f" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#2d7a4f" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="92%" cy="100%" r="55%">
      <stop offset="0%" stop-color="#c41e3a" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#c41e3a" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 60 0 L 0 0 0 60" fill="none" stroke="#1f2a24" stroke-width="1"/>
    </pattern>
    <radialGradient id="mask" cx="50%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <mask id="gridMask">
      <rect width="1200" height="630" fill="url(#mask)"/>
    </mask>
  </defs>

  <rect width="1200" height="630" fill="#0a0f0d"/>
  <rect width="1200" height="630" fill="url(#grid)" mask="url(#gridMask)" opacity="0.55"/>
  <rect width="1200" height="630" fill="url(#glow1)"/>
  <rect width="1200" height="630" fill="url(#glow2)"/>

  <!-- Status pill -->
  <g transform="translate(120, 200)">
    <rect x="0" y="0" rx="20" ry="20" width="240" height="36" fill="#131a16" stroke="#2a3a32"/>
    <circle cx="20" cy="18" r="5" fill="#2d7a4f"/>
    <text x="36" y="24" font-family="ui-monospace, 'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace"
          font-size="13" font-weight="500" fill="#b8c0bb" letter-spacing="1">OPERATIONAL · PRE-LAUNCH</text>
  </g>

  <!-- Wordmark -->
  <text x="120" y="370"
        font-family="'JetBrains Mono', ui-monospace, 'SF Mono', Menlo, Consolas, monospace"
        font-size="104" font-weight="600" fill="#e8eae8" letter-spacing="2">
    <tspan fill="#c41e3a">&gt;</tspan> cipher pine<tspan fill="#c41e3a" dx="4">_</tspan>
  </text>

  <!-- Tagline -->
  <text x="120" y="430"
        font-family="'JetBrains Mono', ui-monospace, 'SF Mono', Menlo, Consolas, monospace"
        font-size="22" font-weight="500" fill="#2d7a4f" letter-spacing="3">FROM SIGNAL TO SOFTWARE.</text>

  <!-- Lead -->
  <text x="120" y="500"
        font-family="'Inter', system-ui, -apple-system, Segoe UI, Roboto, sans-serif"
        font-size="22" fill="#b8c0bb">A North Carolina studio building AI-native tools, apps, and games.</text>

  <!-- URL -->
  <text x="120" y="560"
        font-family="'JetBrains Mono', ui-monospace, 'SF Mono', Menlo, Consolas, monospace"
        font-size="18" fill="#8a948e" letter-spacing="1.5">cipherpine.com</text>
</svg>
